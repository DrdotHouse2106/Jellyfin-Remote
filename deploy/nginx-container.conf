# Nginx-Konfiguration INNERHALB des Containers.
# Die App liegt unter /usr/share/nginx/html/remote/ und wird unter /remote/ ausgeliefert.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Relative Weiterleitungen – funktionieren auch hinter einem HTTPS-Reverse-Proxy.
    absolute_redirect off;

    location = / { return 302 /remote/; }
    location = /remote { return 301 /remote/; }

    location /remote/ {
        try_files $uri $uri/ =404;
    }

    # Einstiegsseite, Manifest und Service Worker nie cachen, damit Updates sofort ankommen.
    location = /remote/index.html          { add_header Cache-Control "no-cache"; }
    location = /remote/manifest.json       { add_header Cache-Control "no-cache"; }
    location = /remote/service-worker.js   { add_header Cache-Control "no-cache"; }
}
