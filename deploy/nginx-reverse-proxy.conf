# Beispiel: bestehender Nginx-Reverse-Proxy für jellyfin.example.de
# Nur die beiden "remote"-Blöcke in deinen vorhandenen server { … }-Block übernehmen.

server {
    listen 443 ssl http2;
    server_name jellyfin.example.de;

    # ssl_certificate     /etc/letsencrypt/live/jellyfin.example.de/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/jellyfin.example.de/privkey.pem;

    # ---------- Jellyfin Remote ----------
    location = /remote { return 301 /remote/; }

    # Variante A: Container aus docker-compose.yml (Pfad wird unverändert weitergereicht)
    location /remote/ {
        proxy_pass http://127.0.0.1:8097;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Variante B: ohne Docker – Inhalt des Ordners app/ nach /var/www/jellyfin-remote/ kopieren
    # location /remote/ {
    #     alias /var/www/jellyfin-remote/;
    #     index index.html;
    # }

    # ---------- Jellyfin (bestehende Konfiguration) ----------
    location / {
        proxy_pass http://127.0.0.1:8096;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;

        # WebSocket-Unterstützung für Jellyfin
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
    }
}
