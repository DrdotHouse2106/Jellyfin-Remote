# Baut das Jellyfin-Plugin und veröffentlicht es als GitHub-Release.
# Anschließend wird jellyfin-repository.json aktualisiert – diese Datei trägt man
# in Jellyfin unter Dashboard → Plugins → Repositories ein.
#
# Auslösen: Tag pushen, z. B.  git tag v1.0.1 && git push origin v1.0.1
name: Plugin-Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (z. B. 1.0.1)'
        required: true

permissions:
  contents: write

env:
  TARGET_ABI: '12.2.0.0'
  PLUGIN_GUID: 'e7f6d1e2-2069-4a41-804f-19632a1e5966'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Bei einem Tag-Push genau diesen Tag bauen, beim manuellen Start main.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'

      - name: Version ermitteln
        id: version
        # Eingabe über env statt direkt im Skript – sonst ließe sich über die Versionsangabe Shell-Code einschleusen.
        env:
          INPUT_VERSION: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          VERSION="${INPUT_VERSION#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Ungültige Version '$VERSION' (erwartet z. B. 1.0.1)"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "zip=jellyfin-remote_$VERSION.0.zip" >> "$GITHUB_OUTPUT"

      - name: Versionsnummer in die App schreiben
        run: |
          V="${{ steps.version.outputs.version }}"
          sed -i "s/APP_VERSION = '[^']*'/APP_VERSION = '$V'/" app/js/version.js
          sed -i "s/const CACHE_NAME = 'jellyfin-remote-[^']*'/const CACHE_NAME = 'jellyfin-remote-$V'/" app/service-worker.js
          sed -i "s#<Version>[^<]*</Version>#<Version>$V</Version>#" plugin/Jellyfin.Plugin.Remote/Jellyfin.Plugin.Remote.csproj
          grep -n "APP_VERSION =" app/js/version.js
          grep -n "CACHE_NAME =" app/service-worker.js

      - name: Änderungen aus CHANGELOG.md lesen
        run: |
          python3 scripts/changelog.py "${{ steps.version.outputs.version }}" > changelog.txt
          if [ ! -s changelog.txt ]; then
            echo "::error::In CHANGELOG.md fehlt der Abschnitt '## ${{ steps.version.outputs.version }}'"
            exit 1
          fi
          cat changelog.txt

      - name: Plugin bauen
        run: dotnet publish plugin/Jellyfin.Plugin.Remote -c Release -o build -p:Version=${{ steps.version.outputs.version }}

      - name: Paket erstellen
        id: package
        run: |
          VERSION="${{ steps.version.outputs.version }}.0"
          TIMESTAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          mkdir -p package
          cp build/Jellyfin.Plugin.Remote.dll package/
          cat > package/meta.json <<JSON
          {
            "category": "General",
            "changelog": $(python3 -c 'import json; print(json.dumps(open("changelog.txt", encoding="utf-8").read().strip()))'),
            "description": "Fernbedienung und Mediathek-Browser für Smartphones – erreichbar unter /remote/.",
            "guid": "${PLUGIN_GUID}",
            "name": "Jellyfin Remote",
            "overview": "Smartphone-Fernbedienung für Jellyfin",
            "owner": "${{ github.repository_owner }}",
            "targetAbi": "${TARGET_ABI}",
            "timestamp": "${TIMESTAMP}",
            "version": "${VERSION}",
            "status": "Active",
            "autoUpdate": true,
            "assemblies": []
          }
          JSON
          (cd package && zip -q "../${{ steps.version.outputs.zip }}" *)
          echo "checksum=$(md5sum ${{ steps.version.outputs.zip }} | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "timestamp=$TIMESTAMP" >> "$GITHUB_OUTPUT"

      - name: GitHub-Release erstellen
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Jellyfin Remote ${{ steps.version.outputs.version }}
          files: ${{ steps.version.outputs.zip }}
          body_path: changelog.txt

      - name: Repository-Datei aktualisieren
        env:
          VERSION: ${{ steps.version.outputs.version }}.0
          SOURCE_URL: https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}/${{ steps.version.outputs.zip }}
          CHECKSUM: ${{ steps.package.outputs.checksum }}
          TIMESTAMP: ${{ steps.package.outputs.timestamp }}
        run: |
          python3 - <<'PY'
          import json, os
          path = 'jellyfin-repository.json'
          repo = json.load(open(path, encoding='utf-8'))
          plugin = next(p for p in repo if p['guid'] == os.environ['PLUGIN_GUID'])
          plugin['versions'] = [v for v in plugin['versions'] if v['version'] != os.environ['VERSION']]
          plugin['versions'].insert(0, {
              'version': os.environ['VERSION'],
              'changelog': open('changelog.txt', encoding='utf-8').read().strip(),
              'targetAbi': os.environ['TARGET_ABI'],
              'sourceUrl': os.environ['SOURCE_URL'],
              'checksum': os.environ['CHECKSUM'],
              'timestamp': os.environ['TIMESTAMP'],
          })
          with open(path, 'w', encoding='utf-8') as f:
              json.dump(repo, f, indent=2, ensure_ascii=False)
              f.write('\n')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jellyfin-repository.json app/js/version.js app/service-worker.js plugin/Jellyfin.Plugin.Remote/Jellyfin.Plugin.Remote.csproj
          git commit -m "Release ${{ steps.version.outputs.version }}"
          # Bei einem Tag-Build kann main schon weiter sein – dann den Release-Commit auf main setzen und erneut pushen.
          for attempt in 1 2 3; do
            git push origin HEAD:main && exit 0
            git fetch origin main
            git rebase origin/main
          done
          echo "::error::Release-Commit konnte nicht auf main gepusht werden – jellyfin-repository.json ist nicht aktualisiert"
          exit 1
