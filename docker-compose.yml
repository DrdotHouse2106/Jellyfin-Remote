# Startet die Jellyfin-Remote-PWA als eigenen Container.
#   docker compose up -d --build
# Danach im Reverse-Proxy den Pfad /remote/ auf diesen Container weiterleiten
# (Beispiele im Ordner deploy/ und in der README).
services:
  jellyfin-remote:
    build: .
    container_name: jellyfin-remote
    restart: unless-stopped
    ports:
      - "8097:80"
    # Liegt Jellyfin bzw. der Reverse-Proxy in einem eigenen Docker-Netzwerk,
    # stattdessen dieses Netzwerk eintragen und die Port-Freigabe entfernen:
    # networks:
    #   - proxy
# networks:
#   proxy:
#     external: true
